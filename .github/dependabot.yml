version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(gha)
    pull-request-branch-name:
      separator: "/"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(pip)
    pull-request-branch-name:
      separator: "/"
